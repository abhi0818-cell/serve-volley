<style>

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);padding:0 max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1200px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-size:26px;line-height:1.1}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding:20px 0 14px;border-bottom:2px solid var(--ink)}
.brand{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:.03em}
.brand small{display:block;font:500 12px var(--font-body);letter-spacing:.14em;color:var(--muted);margin-top:4px}
.right{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
nav{display:flex;gap:4px;overflow-x:auto;max-width:100%}
nav a{font-family:var(--font-display);font-weight:600;font-size:19px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-decoration:none;padding:6px 14px;border-bottom:3px solid transparent;white-space:nowrap}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--primary)}
.who{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;color:var(--ink)}
.notice{margin-top:12px;padding:8px 12px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin:18px 0 12px}
.dates{display:flex;gap:4px;overflow-x:auto;max-width:100%;padding-bottom:4px}
.dbtn{flex:none;min-width:58px;padding:5px 8px;background:var(--surface);border:1px solid var(--line);text-align:center;line-height:1.15}
.dbtn span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dbtn b{font:700 20px var(--font-display)}
.dbtn[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.dbtn[aria-pressed="true"] span{color:inherit}
.chips{display:flex;gap:4px;align-items:center}
.chip{padding:6px 14px;background:var(--surface);border:1px solid var(--line);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.gridwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);padding:8px}
.grid{display:grid;grid-template-columns:130px repeat(var(--cols),60px);gap:2px;width:max-content}
.g-head{font:600 12px var(--font-body);color:var(--muted);text-align:center;padding:4px 0}
.g-court{position:sticky;left:0;z-index:2;background:var(--surface);display:flex;flex-direction:column;justify-content:center;padding-right:8px;min-height:60px}
.g-court b{font:700 18px/1.1 var(--font-display);text-transform:uppercase;letter-spacing:.03em}
.g-court span{font-size:11px;color:var(--muted)}
.cell{height:60px;border:1px solid var(--line);background:var(--surface);padding:2px 3px;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;min-width:0}
button.cell.free:hover{border-color:var(--primary);color:var(--ink)}
.cell.sel{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600}
.cell.past{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px);border-color:transparent;opacity:.7}
.cell.booked{background:color-mix(in srgb,var(--s,var(--src-hold)) 20%,var(--surface));border-color:color-mix(in srgb,var(--s,var(--src-hold)) 35%,var(--surface));box-shadow:inset 0 -4px 0 var(--s,var(--src-hold));color:var(--ink);line-height:1.15;padding-bottom:6px}
.cell.booked.cont{margin-left:-2px;border-left-color:transparent}
.cell.booked b{font:700 11px var(--font-body);letter-spacing:.06em}
.cell.booked i{font-style:normal;font-size:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.booked.picked{outline:2px solid var(--ink);outline-offset:-2px}

.cell.chg::before{content:'⇄';position:absolute;top:2px;left:4px;font-weight:700;color:#7c3aed}.cell.in::after{content:'✓';position:absolute;top:2px;right:4px;font-weight:700}.cell.late{outline:2px solid #c2410c;outline-offset:-2px}.s-web{--s:var(--src-web)}.s-desk{--s:var(--src-desk)}.s-playtomic{--s:var(--src-playtomic)}.s-courtreserve{--s:var(--src-courtreserve)}.s-program{--s:var(--src-program)}.s-hold{--s:var(--src-hold)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;background:var(--s,var(--surface));display:inline-block}
.sw.free{background:var(--surface);border:1px solid var(--line)}
.sw.past{background:repeating-linear-gradient(135deg,transparent 0 3px,var(--line) 3px 4px)}
.sw.sel{background:var(--primary)}
.panel{background:var(--surface);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:12px}
@media (max-width:980px){.panel{position:static}}
.when{font-size:16px;font-weight:500}
.muted{color:var(--muted);font-size:13px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
input,select{background:var(--bg);border:1px solid var(--line);padding:9px 10px;font-weight:400;width:100%;min-width:0}
.seg{display:flex}
.seg button{flex:1;padding:8px;background:var(--bg);border:1px solid var(--line);margin-left:-1px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.btn{padding:11px 16px;background:var(--primary);color:var(--on-primary);border:0;font:700 17px var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.btn:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.danger{background:var(--bad);color:var(--surface)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.err{color:var(--bad);font-size:13px;font-weight:600}
.okmsg{color:var(--ok);font-size:14px;font-weight:600}
.price{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0}
.price b{font:700 26px var(--font-display);font-variant-numeric:tabular-nums}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
dt{color:var(--muted)}dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ref{font:500 22px var(--font-mono);letter-spacing:.06em;background:var(--bg);border:1px dashed var(--ink);padding:10px;text-align:center}
.list{display:grid;gap:10px;margin-top:18px}
.item{background:var(--surface);border:1px solid var(--line);padding:14px 16px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
.item h3{font-size:20px;text-transform:uppercase}
.tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border:1px solid currentColor}
.tag.cx{color:var(--muted)}
.stats{margin:0 0 14px;background:var(--surface);border:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;justify-content:space-between}
.stats b{font:700 30px var(--font-display)}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:18px;align-items:start}
.setbox{background:var(--surface);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:12px}
.setbox h3{font-size:22px;text-transform:uppercase}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{flex-direction:row;align-items:center;gap:8px;font-weight:500}
.check input{width:auto}

var CURS=[['USD','US dollar'],['CAD','Canadian dollar'],['MXN','Mexican peso'],['GBP','British pound'],['EUR','Euro'],['CHF','Swiss franc'],['SEK','Swedish krona'],['NOK','Norwegian krone'],['DKK','Danish krone'],['PLN','Polish zloty'],['AED','UAE dirham'],['SAR','Saudi riyal'],['INR','Indian rupee'],['SGD','Singapore dollar'],['MYR','Malaysian ringgit'],['THB','Thai baht'],['IDR','Indonesian rupiah'],['PHP','Philippine peso'],['VND','Vietnamese dong'],['JPY','Japanese yen'],['KRW','South Korean won'],['CNY','Chinese yuan'],['HKD','Hong Kong dollar'],['AUD','Australian dollar'],['NZD','New Zealand dollar'],['ZAR','South African rand'],['BRL','Brazilian real'],['CLP','Chilean peso'],['COP','Colombian peso']];
function money(n,cur){cur=cur||(S.settings&&S.settings.currency)||'USD';var v=Number(n);try{return new Intl.NumberFormat(undefined,{style:'currency',currency:cur,minimumFractionDigits:v%1?2:0,maximumFractionDigits:2}).format(v)}catch(e){return cur+' '+v}}
function priceFor(sport,date,h){var peak=dow(date)%6===0||h>=S.settings.peak_start_hour;var r=S.rates[sport+(peak?'_p':'_o')];return {amt:r,peak:peak}}
function slotRange(date,h){return [zoned(date,h,S.settings.timezone),zoned(date,h+1,S.settings.timezone)]}
function busyRec(courtId,date,h){var r=slotRange(date,h),list=S.busy[courtId]||[];for(var i=0;i<list.length;i++){var b=list[i];if(new Date(b.start_time)<r[1]&&new Date(b.end_time)>r[0])return b}return null}
function markerCell(b,lab,cfg){
  cfg=cfg||S.settings;var m=cfg.booked_marker||'both',txt=cfg.booked_show_text!==false,sp=b&&b.sport,held=!!(b&&b.held);
  if(m==='taken'||!sp)return '<div class="cell booked'+(held?' held':'')+'" aria-label="'+esc(lab+(held?', held while paying':sp||m==='taken'?', taken':', closed'))+'"><i>'+(held?'Held':sp||m==='taken'?'Taken':'Closed')+'</i></div>';
  var pb=sp==='pickleball',id=m==='racket'?(pb?'paddle':'racket'):m==='ball'?(pb?'ball':'shuttle'):(pb?'pb-both':'bd-both'),name=pb?'Pickleball':'Badminton';
  return '<div class="cell booked sp-'+sp+(held?' held':'')+'" role="img" aria-label="'+esc(lab+', '+name+(held?', held while paying':', booked'))+'"><svg class="ic" aria-hidden="true"><use href="#ic-'+id+'"/></svg>'+(held?'<i class="sn">Held</i>':txt?'<i class="sn nm">'+name+'</i>':'')+'</div>';
}
function isBusy(courtId,date,h){var r=slotRange(date,h),list=S.busy[courtId]||[];return list.some(function(b){return new Date(b.start_time)<r[1]&&new Date(b.end_time)>r[0]})}
function isPast(date,h){return slotRange(date,h)[0]<=new Date()}
function isFree(courtId,h){return !isBusy(courtId,S.date,h)&&!isPast(S.date,h)}

/* ---------- loading ---------- */
async function loadStatic(){
  var r=await Promise.all([sb.from('club_settings').select('*').single(),sb.from('courts').select('*').eq('is_active',true).order('name'),sb.from('court_rates').select('*')]);
  if(r[0].error||r[1].error||r[2].error)throw (r[0].error||r[1].error||r[2].error);
  S.settings=r[0].data;S.courts=r[1].data;S.rates={};r[2].data.forEach(function(x){S.rates[x.sport+(x.peak?'_p':'_o')]=Number(x.price)});
  var t=todayIn(S.settings.timezone);S.date=t;S.days=[];for(var i=0;i<=S.settings.max_days_ahead;i++)S.days.push(addDays(t,i));
}
async function loadAvailability(){
  var a=zoned(S.date,0,S.settings.timezone).toISOString(),b=zoned(addDays(S.date,1),0,S.settings.timezone).toISOString();
  var res=await Promise.all(S.courts.map(function(c){return sb.rpc('get_court_busy_slots',{p_court_id:c.id,p_range_start:a,p_range_end:b})}));
  S.busy={};res.forEach(function(r,i){S.busy[S.courts[i].id]=r.data||[]});
  if(S.view==='staff'&&S.isAdmin){
    var q=await sb.from('bookings').select('*').neq('status','cancelled').lt('start_time',b).gt('end_time',a).order('start_time');
    S.staffRows=q.data||[];
    var bl=await sb.from('blocked_slots').select('*').lt('start_time',b).gt('end_time',a);

async function loadQuote(){

  var key=S.date+'|'+S.sel.h+'|'+S.dur+'|'+S.sport,start=zoned(S.date,S.sel.h,S.settings.timezone).toISOString();

function isAuto(){return S.view==='book'&&S.settings&&S.settings.assign_mode!=='player'}
function courtFreeFor(c,h,n){for(var i=0;i<n;i++){if(hoursFor(c).indexOf(h+i)<0||!isFree(c.id,h+i))return false}return true}
function autoFree(h,n){return S.courts.some(function(c){return courtFreeFor(c,h,n||1)})}
function inSel(c,h){return S.sel&&S.sel.c===c&&h>=S.sel.h&&h<S.sel.h+S.dur}
function staffRec(courtId,h){var r=slotRange(S.date,h);return S.staffRows.find(function(x){return x.court_id===courtId&&new Date(x.start_time)<r[1]&&new Date(x.end_time)>r[0]})}

          h+='<button class="cell booked s-'+rec.source+(cont?' cont':'')+(pk?' picked':'')+(inn?' in':'')+(late?' late':'')+(chg?' chg':'')+'" data-act="open" data-c="'+c.id+'" data-h="'+hr+'" aria-label="'+esc(lab+', '+SOURCES[rec.source]+', '+(rec.player_name||rec.label||''))+'">'+(cont?'':'<b>'+CODES[rec.source]+(rec.sport?' · '+(rec.sport==='pickleball'?'PB':'BD'):'')+'</b><i>'+esc(rec.player_name||rec.label||'')+'</i>')+'</button>';

      }
    });
  });

  var lg='<span><i class="sw free"></i>Open'+(staff?'':' (price per hour)')+'</span>'+(staff?'<span>✓ checked in</span><span style="color:#7c3aed">⇄ switch sport on this court</span><span style="color:#c2410c">Orange outline: 15+ min late, not checked in</span>':'')+'<span><i class="sw past"></i>Passed or closed</span>';

var RZP=null;
function loadRzp(){if(window.Razorpay)return Promise.resolve();if(RZP)return RZP;RZP=new Promise(function(ok,no){var s=document.createElement('script');s.src='https://checkout.razorpay.com/v1/checkout.js';s.onload=ok;s.onerror=function(){RZP=null;no(new Error('load'))};document.head.appendChild(s)});return RZP}
function payMsg(code){return ERR[code]||ERR.network}
async function callPay(body){
  try{var r=await sb.functions.invoke('pay',{body:body});
    if(r.error){var m='';try{var j=await r.error.context.json();m=j.error||''}catch(e){}return {error:m||'network'}}
    return r.data||{}}catch(e){return {error:'network'}}
}
function holdLeft(b){return b&&b.hold_expires_at?Math.max(0,Math.floor((new Date(b.hold_expires_at)-new Date())/1000)):0}
async function releaseHold(id){await sb.rpc('cancel_booking',{p_booking_id:id})}
async function startPayment(b){
  S.err='';S.busyBtn=true;renderPanel();renderMine();
  var o=await callPay({action:'create_order',booking_id:b.id});
  if(o.error){
    S.busyBtn=false;S.err=payMsg(o.error);
    if(o.error==='payments_not_configured'||o.error==='order_failed'||o.error==='hold_expired'){await releaseHold(b.id);S.pending=null}
    await refresh();await loadMine();renderPanel();renderMine();return}
  try{await loadRzp()}catch(e){S.busyBtn=false;S.err='Could not load the payment window. Check your connection and try again.';renderPanel();renderMine();return}
  var rz=new window.Razorpay({key:o.key_id,order_id:o.order_id,amount:o.amount,currency:o.currency,name:'Smash & Volley',description:'Court booking '+o.reference,
    prefill:{name:(S.form&&S.form.name)||b.player_name||'',email:S.user?S.user.email:'',contact:(S.form&&S.form.phone)||b.player_phone||''},theme:{color:'#17594d'},
    handler:async function(resp){
      S.busyBtn=true;S.verifying=true;renderPanel();renderMine();
      var v=await callPay({action:'verify',booking_id:b.id,razorpay_order_id:resp.razorpay_order_id,razorpay_payment_id:resp.razorpay_payment_id,razorpay_signature:resp.razorpay_signature});
      S.busyBtn=false;S.verifying=false;
      if(v.error){S.err=payMsg(v.error)+' Check My bookings in a minute.'}
      else if(v.status==='expired'){S.pending=null;S.err='Your payment arrived after the hold expired, so the slot was released. '+(v.refunded?'The money is being refunded to you.':'We will refund you; please contact the club if it does not arrive.')}
      else{var pb=S.pending&&S.pending.id===b.id?S.pending:b;S.done={reference:pb.reference,court:pb.court||courtName(pb.court_id),sport:pb.sport,start_time:pb.start_time,end_time:pb.end_time,price:pb.price,paid:true};S.pending=null;S.err=''}
      var cb2=await sb.rpc('my_credit');S.credit=Number(cb2&&cb2.data)||0;await refresh();await loadMine();renderPanel();renderMine()},
    modal:{ondismiss:function(){S.busyBtn=false;renderPanel();renderMine()}}});
  rz.on('payment.failed',function(){S.err='That payment did not go through. You can try again before the hold runs out.'});
  rz.open();
}

function authErr(e){
  var s=((e&&e.code)||'')+' '+((e&&e.message)||'');s=s.toLowerCase();
  if(s.indexOf('invalid login')>-1||s.indexOf('invalid_credentials')>-1)return 'Email or password is incorrect.';
  if(s.indexOf('not confirmed')>-1||s.indexOf('email_not_confirmed')>-1)return 'Confirm your email first, using the link we sent you.';
  if(s.indexOf('already')>-1)return 'That email already has an account. Sign in instead.';
  if(s.indexOf('rate')>-1||s.indexOf('too many')>-1)return 'Too many attempts. Wait a few minutes and try again.';
  if(s.indexOf('same')>-1&&s.indexOf('password')>-1)return 'Choose a password different from your old one.';
  if(s.indexOf('weak')>-1||s.indexOf('password')>-1)return 'Choose a stronger password (8+ characters).';
  return 'Could not complete that. Please try again.';
}
async function doAuth(){
  var m=S.authMode,f=S.form,em=(f.email||'').trim(),back=location.origin+location.pathname;S.authMsg='';S.authOk=false;
  if(m!=='reset'&&!/^\S+@\S+\.\S+$/.test(em))S.authMsg='Enter a valid email address.';
  else if(m==='signin'&&!f.password)S.authMsg='Enter your password.';
  else if(m==='signup'&&!f.name.trim())S.authMsg='Enter your name.';
  else if((m==='signup'||m==='reset')&&(f.password||'').length<8)S.authMsg='Use at least 8 characters for your password.';
  else if(m==='reset'&&f.password!==f.password2)S.authMsg='The two passwords do not match.';
  if(S.authMsg)return renderPanel();
  S.authBusy=true;renderPanel();var r;
  try{
    if(m==='signin')r=await sb.auth.signInWithPassword({email:em,password:f.password});
    else if(m==='signup')r=await sb.auth.signUp({email:em,password:f.password,options:{data:{full_name:f.name.trim()},emailRedirectTo:back}});
    else if(m==='forgot')r=await sb.auth.resetPasswordForEmail(em,{redirectTo:back});
    else if(m==='reset')r=await sb.auth.updateUser({password:f.password});
    else r=await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:back}});
  }catch(e){r={error:e}}
  S.authBusy=false;
  if(r.error){S.authMsg=authErr(r.error)}
  else if(m==='signin'){f.password='';S.showAuth=false}
  else if(m==='signup'){
    if(r.data&&r.data.session){f.password='';S.showAuth=false}
    else if(r.data&&r.data.user&&r.data.user.identities&&r.data.user.identities.length===0)S.authMsg='That email already has an account. Sign in instead.';
    else{S.authOk=true;S.authMsg='Account created. Check your email to confirm it, then sign in. The email can take a few minutes; check spam.';f.password=''}
  }
  else if(m==='forgot'){S.authOk=true;S.authMsg='If that email has an account, a reset link is on its way. Check your inbox and spam.'}
  else if(m==='reset'){f.password='';f.password2='';S.authMode='signin';S.showAuth=false;await loadProfile();renderHead()}
  else{S.authOk=true;S.authMsg='Check your email for the sign-in link, then return to this page.'}
  renderPanel();
}

/* ---------- admin settings ---------- */
var TZS=['America/New_York','America/Chicago','America/Denver','America/Phoenix','America/Los_Angeles','America/Anchorage','Pacific/Honolulu','America/Toronto','America/Vancouver','Europe/London','Europe/Paris','Asia/Kolkata','Asia/Dubai','Asia/Singapore','Australia/Sydney'];
async function loadCfg(){
  var r=await Promise.all([sb.from('club_settings').select('*').single(),sb.from('court_rates').select('*'),sb.from('courts').select('*').order('name')]);
  var rates={};(r[1].data||[]).forEach(function(x){rates[x.sport+(x.peak?'_p':'_o')]=Number(x.price)});
  S.cfg={s:Object.assign({},r[0].data),r:rates,c:(r[2].data||[]).map(function(c){return {id:c.id,name:c.name,description:c.description||'',open:parseInt(c.open_time,10),close:parseInt(c.close_time,10),active:c.is_active}})};
  S.cfgMsg={};
}
function hourOpts(sel,from,to){var o='';for(var h=from;h<=to;h++)o+='<option value="'+h+'"'+(+sel===h?' selected':'')+'>'+fmt(h)+'</option>';return o}
function numOpts(sel,from,to,unit){var o='';for(var n=from;n<=to;n++)o+='<option value="'+n+'"'+(+sel===n?' selected':'')+'>'+n+(unit?' '+unit+(n===1?'':'s'):'')+'</option>';return o}
function cfgMsg(sec){var m=S.cfgMsg&&S.cfgMsg[sec];return m?'<div class="'+(m.ok?'okmsg':'err')+'" role="alert">'+esc(m.t)+'</div>':''}
function renderSettings(){
  var el=$('v-settings');
  if(!S.cfg){el.innerHTML='<p class="muted" style="margin-top:20px">Loading settings…</p>';return}
  var s=S.cfg.s,r=S.cfg.r,b=S.busyBtn?' disabled':'';
  var curSym=function(){return money(0,s.currency).replace(/[\d.,\s]/g,'')||s.currency};
  var rate=function(sp,pk,lab){return '<label>'+lab+' ('+curSym()+' per hour)<input type="number" min="0" step="0.5" inputmode="decimal" data-k="r.'+sp+'_'+pk+'" value="'+esc(r[sp+'_'+pk]!=null?r[sp+'_'+pk]:'')+'"></label>'};
  el.innerHTML='<h2 style="margin-top:20px">Settings</h2><p class="muted" style="margin-top:6px">Changes apply to new bookings straight away. Existing bookings are not changed.</p><div class="setgrid">'+
  '<div class="setbox"><h3>Club</h3>'+
   '<label>Currency<select data-k="s.currency">'+CURS.map(function(c){return '<option value="'+c[0]+'"'+(s.currency===c[0]?' selected':'')+'>'+c[0]+' · '+c[1]+'</option>'}).join('')+'</select><span class="muted">Rates are shown in this currency. Existing bookings keep the currency they were made in.</span></label>'+
   '<label>Courts are assigned<select data-k="s.assign_mode"><option value="auto"'+((s.assign_mode||'auto')==='auto'?' selected':'')+'>Automatically (player picks sport and time)</option><option value="player"'+(s.assign_mode==='player'?' selected':'')+'>Player picks the court</option></select><span class="muted">Automatic keeps the same sport on the same court where it can.</span></label>'+
   '<label>Time zone<input list="tzlist" data-k="s.timezone" value="'+esc(s.timezone)+'" autocomplete="off"></label><datalist id="tzlist">'+TZS.map(function(z){return '<option value="'+z+'">'}).join('')+'</datalist>'+
   '<label>Peak rates start at<select data-k="s.peak_start_hour">'+hourOpts(s.peak_start_hour,0,23)+'</select></label>'+
   '<label>Longest booking<select data-k="s.max_hours">'+numOpts(s.max_hours,1,4,'hour')+'</select></label>'+
   '<label>Upcoming bookings per player<select data-k="s.max_upcoming_per_user">'+numOpts(s.max_upcoming_per_user,1,20)+'</select></label>'+
   '<label>Players can cancel until<select data-k="s.cancel_cutoff_hours">'+numOpts(s.cancel_cutoff_hours,0,48,'hour')+'</select><span class="muted">before the start time</span></label>'+
   '<label>Bookable days ahead<select data-k="s.max_days_ahead">'+numOpts(s.max_days_ahead,1,60,'day')+'</select></label>'+
   '<label class="check"><input type="checkbox" data-k="s.payment_required"'+(s.payment_required?' checked':'')+'>Take payment online when players book</label><span class="muted">Turn this on only after the Razorpay keys are added (see README). Players cancel until the cutoff above and get the amount back as credit, not money. After the cutoff they cannot cancel.</span>'+
   '<label>Credit given for a no-show (%)<input type="number" min="0" max="100" step="5" data-k="s.no_show_credit_percent" value="'+esc(s.no_show_credit_percent!=null?s.no_show_credit_percent:100)+'"></label>'+
   '<label>Hold the slot while paying<select data-k="s.hold_minutes">'+numOpts(s.hold_minutes||10,5,30,'minute')+'</select></label>'+
   cfgMsg('club')+'<button class="btn" data-act="save-club"'+b+'>Save club settings</button></div>'+
  '<div class="setbox"><h3>Booked slots</h3><p class="muted">What players see on a booked square when they pick the court themselves.</p>'+
   '<label>Show<select data-k="s.booked_marker">'+[['taken','Just "Taken"'],['racket','Racket or paddle only'],['ball','Ball or shuttle only'],['both','Racket and ball (paddle + ball, racket + shuttle)']].map(function(o){return '<option value="'+o[0]+'"'+((s.booked_marker||'both')===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></label>'+
   '<label class="check"><input type="checkbox" data-k="s.booked_show_text"'+(s.booked_show_text!==false?' checked':'')+((s.booked_marker||'both')==='taken'?' disabled':'')+'>Add the sport name under the icon</label><span class="muted">On phones the name is hidden to keep squares readable.</span>'+
   '<div class="grid" style="--cols:3;grid-template-columns:repeat(3,60px);margin-top:4px">'+markerCell({sport:'pickleball'},'Preview',s)+markerCell({sport:'badminton'},'Preview',s)+markerCell({sport:'pickleball',held:true},'Preview',s)+'</div>'+
   cfgMsg('marker')+'<button class="btn" data-act="save-marker"'+b+'>Save booked slots</button></div>'+
  '<div class="setbox"><h3>Rates</h3><p class="muted">Peak is weekends, and weekdays from the peak start time above.</p>'+
   rate('pickleball','o','Pickleball off-peak')+rate('pickleball','p','Pickleball peak')+rate('badminton','o','Badminton off-peak')+rate('badminton','p','Badminton peak')+
   cfgMsg('rates')+'<button class="btn" data-act="save-rates"'+b+'>Save rates</button></div>'+
  '<div class="setbox"><h3>Courts</h3>'+S.cfg.c.map(function(c){return '<div class="setbox" style="background:var(--bg)"><label>Name<input data-k="c.'+c.id+'.name" value="'+esc(c.name)+'"></label><label>Description<input data-k="c.'+c.id+'.description" value="'+esc(c.description)+'"></label><div class="two"><label>Opens<select data-k="c.'+c.id+'.open">'+hourOpts(c.open,0,22)+'</select></label><label>Closes<select data-k="c.'+c.id+'.close">'+hourOpts(c.close,1,23)+'</select></label></div><label class="check"><input type="checkbox" data-k="c.'+c.id+'.active"'+(c.active?' checked':'')+'>Open for booking</label></div>'}).join('')+
   cfgMsg('courts')+'<button class="btn" data-act="save-courts"'+b+'>Save courts</button></div></div>';
}
function setCfg(el){
  var k=el.dataset&&el.dataset.k;if(!k||!S.cfg)return;var p=k.split('.'),v=el.type==='checkbox'?el.checked:el.value;
  if(p[0]==='s')S.cfg.s[p[1]]=v;else if(p[0]==='r')S.cfg.r[p[1]]=v;
  else if(p[0]==='c'){var c=S.cfg.c.find(function(x){return x.id===p[1]});if(c)c[p[2]]=(p[2]==='open'||p[2]==='close')?+v:v}
}
async function saveCfg(sec){
  var c=S.cfg,res,msg='';S.cfgMsg={};
  try{
    if(sec==='club'){
      var s=c.s,tz=String(s.timezone||'').trim();
      try{new Intl.DateTimeFormat('en-US',{timeZone:tz})}catch(e){S.cfgMsg.club={t:'That time zone is not valid. Example: America/New_York.'};return renderSettings()}
      S.busyBtn=true;renderSettings();
      res=await sb.from('club_settings').update({assign_mode:s.assign_mode==='player'?'player':'auto',no_show_credit_percent:Math.min(100,Math.max(0,Math.round(+s.no_show_credit_percent||0))),payment_required:!!s.payment_required,hold_minutes:+s.hold_minutes||10,currency:s.currency||'USD',timezone:tz,peak_start_hour:+s.peak_start_hour,max_hours:+s.max_hours,max_upcoming_per_user:+s.max_upcoming_per_user,cancel_cutoff_hours:+s.cancel_cutoff_hours,max_days_ahead:+s.max_days_ahead}).eq('id',true).select();
    }else if(sec==='marker'){
      var mk=['taken','racket','ball','both'].indexOf(c.s.booked_marker)>-1?c.s.booked_marker:'both';
      S.busyBtn=true;renderSettings();
      res=await sb.from('club_settings').update({booked_marker:mk,booked_show_text:c.s.booked_show_text!==false}).eq('id',true).select();
    }else if(sec==='rates'){
      var rows=[],bad=false;['pickleball','badminton'].forEach(function(sp){['o','p'].forEach(function(pk){var v=parseFloat(c.r[sp+'_'+pk]);if(!(v>=0))bad=true;rows.push({sport:sp,peak:pk==='p',price:v})})});
      if(bad){S.cfgMsg.rates={t:'Enter a price of 0 or more for every rate.'};return renderSettings()}
      S.busyBtn=true;renderSettings();
      res=await sb.from('court_rates').upsert(rows,{onConflict:'sport,peak'}).select();
    }else{
      for(var i=0;i<c.c.length;i++){var ct=c.c[i];
        if(!String(ct.name).trim()){S.cfgMsg.courts={t:'Every court needs a name.'};return renderSettings()}
        if(!(+ct.close>+ct.open)){S.cfgMsg.courts={t:ct.name+': closing time must be after opening time.'};return renderSettings()}}
      S.busyBtn=true;renderSettings();
      for(var j=0;j<c.c.length;j++){var x=c.c[j];
        res=await sb.from('courts').update({name:x.name.trim(),description:x.description.trim()||null,open_time:pad(x.open)+':00',close_time:pad(x.close)+':00',is_active:!!x.active}).eq('id',x.id).select();
        if(res.error||!res.data||!res.data.length)break}
    }
  }catch(e){res={error:e}}
  S.busyBtn=false;
  if(!res||res.error||!res.data||!res.data.length){
    var t=(res&&res.error&&String(res.error.message||'').indexOf('invalid_timezone')>-1)?'That time zone name is not recognised.':(res&&res.error&&/check constraint/i.test(res.error.message||''))?'One of those values is outside the allowed range.':'Could not save. You may need to sign in again as an admin.';
    S.cfgMsg[sec]={t:t};return renderSettings();
  }
  try{await loadStatic()}catch(e){}
  S.cfgMsg[sec]={ok:true,t:'Saved.'};renderSettings();renderHead();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;var a=t.dataset.act;
  if(a==='date'){S.date=t.dataset.d;S.sel=null;S.dur=1;S.mSel=null;S.done=null;S.err='';S.confirmCancel=false;renderToolbar();refresh().then(renderPanel)}
  else if(a==='sport'){S.sport=t.dataset.v;S.quote=null;renderToolbar();renderGrid();renderPanel();loadQuote()}
  else if(a==='pick'){var c=t.dataset.c,h=+t.dataset.h,court=S.courts.find(function(x){return x.id===c});S.done=null;S.err='';S.showAuth=false;S.sel={c:c,h:h};
    if(S.dur===2&&!(c==='auto'?autoFree(h,2):(hoursFor(court).indexOf(h+1)>-1&&isFree(c,h+1))))S.dur=1;S.quote=null;renderGrid();renderPanel();loadQuote()}
  else if(a==='dur'){S.dur=+t.dataset.v;S.quote=null;renderGrid();renderPanel();loadQuote()}
  else if(a==='book')doBook();
  else if(a==='again'){S.done=null;renderPanel()}
  else if(a==='show-auth'){S.showAuth=true;S.authMode='signin';S.authMsg='';S.sel=null;renderGrid();renderPanel()}
  else if(a==='auth-mode'){S.authMode=t.dataset.m;S.authMsg='';S.authOk=false;renderPanel()}
  else if(a==='signout'){sb.auth.signOut().then(function(){S.user=null;S.isAdmin=false;S.mine=[];location.hash='#book';init(true)})}
  else if(a==='open'){S.mSel={c:t.dataset.c,h:+t.dataset.h};S.err='';S.staffMsg='';S.confirmCancel=false;S.confirmNoShow=false;renderGrid();renderPanel()}
  else if(a==='staff-add')doStaffAdd();
  else if(a==='cancel'){S.confirmCancel=true;renderPanel()}
  else if(a==='cancel-no'){S.confirmCancel=false;renderPanel()}
  else if(a==='cancel-yes')doStaffCancel(t.dataset.id);
  else if(a==='mine-cancel')doMineCancel(t.dataset.id);
  else if(a==='pay'||a==='mine-pay'){var pb=(S.pending&&S.pending.id===t.dataset.id)?S.pending:S.mine.find(function(x){return x.id===t.dataset.id});if(pb){if(!S.pending||S.pending.id!==pb.id)S.pending=Object.assign({court:courtName(pb.court_id)},pb);startPayment(S.pending)}}
  else if(a==='pay-release'){releaseHold(t.dataset.id).then(function(){S.pending=null;S.err='';return refresh()}).then(renderPanel)}
  else if(a==='save-profile')saveProfile();
  else if(a==='adj')doAdjust(t.dataset.id);
  else if(a==='check-in')doCheckIn(t.dataset.id);
  else if(a==='undo-in')doUndoCheckIn(t.dataset.id);
  else if(a==='noshow'){S.confirmNoShow=true;renderPanel()}
  else if(a==='noshow-no'){S.confirmNoShow=false;renderPanel()}
  else if(a==='noshow-yes')doNoShow(t.dataset.id);
  else if(a==='save-club')saveCfg('club');
  else if(a==='save-rates')saveCfg('rates');
  else if(a==='save-marker')saveCfg('marker');
  else if(a==='save-courts')saveCfg('courts');
});
document.addEventListener('submit',function(e){var fm=e.target;if(fm.dataset&&fm.dataset.form==='auth'){e.preventDefault();doAuth()}});
document.addEventListener('input',function(e){if(e.target.dataset&&e.target.dataset.f==='useCredit')return;var pp=e.target.dataset&&e.target.dataset.ppl;if(pp){var q=pp.split('.');S.pplIn=S.pplIn||{};S.pplIn[q[0]]=S.pplIn[q[0]]||{};S.pplIn[q[0]][q[1]]=e.target.value}setCfg(e.target);var f=e.target.dataset&&e.target.dataset.f;if(f)S.form[f]=e.target.value});
document.addEventListener('change',function(e){setCfg(e.target);if(e.target.dataset&&/^s\.booked_/.test(e.target.dataset.k||''))renderSettings();var f=e.target.dataset&&e.target.dataset.f;if(f==='useCredit'){S.useCredit=e.target.checked;renderPanel();return}if(f==='stype'){S.form.stype=e.target.value;S.err='';renderPanel()}});
async function route(){
  var v=(location.hash||'#book').slice(1);if(['book','mine','staff','settings','profile','people'].indexOf(v)<0)v='book';
  if((v==='mine'||v==='profile')&&!S.user)v='book';if((v==='staff'||v==='settings'||v==='people')&&!S.isAdmin)v='book';
  S.view=v;S.sel=null;S.mSel=null;S.err='';S.confirmCancel=false;S.dur=1;
  if(v==='mine')await loadMine();
  if(v==='profile'){S.ledger=null;S.pmsg='';renderAll();await loadLedger()}
  if(v==='people'){S.people=null;S.pplMsg={};renderAll();await loadPeople()}
  if(v==='settings'){S.cfg=null;try{await loadCfg()}catch(e){S.cfg=null}}
  renderAll();if(S.ready&&v!=='mine'&&v!=='profile'&&v!=='people')await refresh();
}
window.addEventListener('hashchange',route);
async function init(soft){
  try{
    if(!soft||!S.settings)await loadStatic();
    await loadProfile();S.ready=true;S.loadErr='';
  }catch(e){S.loadErr='The booking service is not reachable right now. Please try again shortly.';S.ready=false}
  await route();
}
sb.auth.onAuthStateChange(function(ev,session){
  setTimeout(function(){
    if(ev==='PASSWORD_RECOVERY'){S.authMode='reset';S.showAuth=true;S.authMsg='';S.form.password='';S.form.password2='';renderHead();renderPanel();return}
    if(ev!=='SIGNED_IN'&&ev!=='SIGNED_OUT')return;
    var uid=session&&session.user?session.user.id:null,cur=S.user?S.user.id:null;
    if(ev==='SIGNED_IN'&&uid===cur)return;
    loadProfile().then(function(){S.authMsg='';S.showAuth=false;renderHead();route()});
  },0);
});
setInterval(function(){if(S.pending&&S.view==='book'&&!S.busyBtn)renderPanel()},5000);
setInterval(function(){if(!document.hidden&&S.ready&&S.view!=='mine'&&S.view!=='settings'&&S.view!=='profile'&&S.view!=='people'&&!S.busyBtn)refresh()},30000);
renderAll();init();
})();
</script>
