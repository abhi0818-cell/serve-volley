<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smash & Volley Courts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#edf1ef; --surface:#fafcfb; --surface2:#e3e9e6; --ink:#14201c; --muted:#58675f; --line:#cfd8d4;
  --primary:#17594f; --on-primary:#e4f06a; --focus:#1a6fd1; --bad:#b0342a; --ok:#18794e;
  --src-web:#1d6fb8; --src-desk:#7a4fb0; --src-playtomic:#c2571a; --src-courtreserve:#b0447a; --src-program:#7d7a10; --src-hold:#5d6762;
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif; --font-body:'Barlow',system-ui,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0c1714; --surface:#13221e; --surface2:#1b2e29; --ink:#e5efeb; --muted:#9bb0a8; --line:#2a403a;
  --primary:#dcec55; --on-primary:#10201b; --focus:#6fb2ff; --bad:#ff8c7d; --ok:#5fd39b;
  --src-web:#5aa8ee; --src-desk:#b79af0; --src-playtomic:#f09a62; --src-courtreserve:#ee86b8; --src-program:#cfc94a; --src-hold:#a2aea9; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);padding:0 max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1200px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-size:26px;line-height:1.1}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding:20px 0 14px;border-bottom:2px solid var(--ink)}
.brand{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:.03em}
.brand small{display:block;font:500 12px var(--font-body);letter-spacing:.14em;color:var(--muted);margin-top:4px}
.right{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
nav{display:flex;gap:4px;overflow-x:auto;max-width:100%}
nav a{font-family:var(--font-display);font-weight:600;font-size:19px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-decoration:none;padding:6px 14px;border-bottom:3px solid transparent;white-space:nowrap}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--primary)}
.who{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;color:var(--ink)}
.notice{margin-top:12px;padding:8px 12px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin:18px 0 12px}
.dates{display:flex;gap:4px;overflow-x:auto;max-width:100%;padding-bottom:4px}
.dbtn{flex:none;min-width:58px;padding:5px 8px;background:var(--surface);border:1px solid var(--line);text-align:center;line-height:1.15}
.dbtn span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dbtn b{font:700 20px var(--font-display)}
.dbtn[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.dbtn[aria-pressed="true"] span{color:inherit}
.chips{display:flex;gap:4px;align-items:center}
.chip{padding:6px 14px;background:var(--surface);border:1px solid var(--line);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.gridwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);padding:8px}
.grid{display:grid;grid-template-columns:130px repeat(var(--cols),60px);gap:2px;width:max-content}
.g-head{font:600 12px var(--font-body);color:var(--muted);text-align:center;padding:4px 0}
.g-court{position:sticky;left:0;z-index:2;background:var(--surface);display:flex;flex-direction:column;justify-content:center;padding-right:8px;min-height:60px}
.g-court b{font:700 18px/1.1 var(--font-display);text-transform:uppercase;letter-spacing:.03em}
.g-court span{font-size:11px;color:var(--muted)}
.cell{height:60px;border:1px solid var(--line);background:var(--surface);padding:2px 3px;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;min-width:0}
button.cell.free:hover{border-color:var(--primary);color:var(--ink)}
.cell.sel{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600}
.cell.past{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px);border-color:transparent;opacity:.7}
.cell.booked{background:color-mix(in srgb,var(--s,var(--src-hold)) 20%,var(--surface));border-color:color-mix(in srgb,var(--s,var(--src-hold)) 35%,var(--surface));box-shadow:inset 0 -4px 0 var(--s,var(--src-hold));color:var(--ink);line-height:1.15;padding-bottom:6px}
.cell.booked.cont{margin-left:-2px;border-left-color:transparent}
.cell.booked b{font:700 11px var(--font-body);letter-spacing:.06em}
.cell.booked i{font-style:normal;font-size:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.booked.picked{outline:2px solid var(--ink);outline-offset:-2px}
.s-web{--s:var(--src-web)}.s-desk{--s:var(--src-desk)}.s-playtomic{--s:var(--src-playtomic)}.s-courtreserve{--s:var(--src-courtreserve)}.s-program{--s:var(--src-program)}.s-hold{--s:var(--src-hold)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;background:var(--s,var(--surface));display:inline-block}
.sw.free{background:var(--surface);border:1px solid var(--line)}
.sw.past{background:repeating-linear-gradient(135deg,transparent 0 3px,var(--line) 3px 4px)}
.sw.sel{background:var(--primary)}
.panel{background:var(--surface);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:12px}
@media (max-width:980px){.panel{position:static}}
.when{font-size:16px;font-weight:500}
.muted{color:var(--muted);font-size:13px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
input,select{background:var(--bg);border:1px solid var(--line);padding:9px 10px;font-weight:400;width:100%;min-width:0}
.seg{display:flex}
.seg button{flex:1;padding:8px;background:var(--bg);border:1px solid var(--line);margin-left:-1px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.btn{padding:11px 16px;background:var(--primary);color:var(--on-primary);border:0;font:700 17px var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.btn:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.danger{background:var(--bad);color:var(--surface)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.err{color:var(--bad);font-size:13px;font-weight:600}
.okmsg{color:var(--ok);font-size:14px;font-weight:600}
.price{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0}
.price b{font:700 26px var(--font-display);font-variant-numeric:tabular-nums}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
dt{color:var(--muted)}dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ref{font:500 22px var(--font-mono);letter-spacing:.06em;background:var(--bg);border:1px dashed var(--ink);padding:10px;text-align:center}
.list{display:grid;gap:10px;margin-top:18px}
.item{background:var(--surface);border:1px solid var(--line);padding:14px 16px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
.item h3{font-size:20px;text-transform:uppercase}
.tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border:1px solid currentColor}
.tag.cx{color:var(--muted)}
.stats{margin:0 0 14px;background:var(--surface);border:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;justify-content:space-between}
.stats b{font:700 30px var(--font-display)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Smash &amp; Volley<small id="tagline">COURT BOOKING</small></div>
    <div class="right"><nav id="nav" aria-label="Sections"></nav><div class="who" id="who"></div></div>
  </header>
  <div id="notice"></div>
  <section id="v-grid">
    <div class="toolbar" id="toolbar"></div>
    <div id="stats"></div>
    <div class="layout">
      <div><div class="gridwrap" id="grid"></div><div class="legend" id="legend"></div></div>
      <aside class="panel" id="panel" aria-live="polite"></aside>
    </div>
  </section>
  <section id="v-mine" hidden></section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* Public connection details. The publishable key is designed to be in the browser; access is enforced by database rules. */
var SUPABASE_URL = 'https://hzgsdpemrzrxwtuiodbq.supabase.co';
var SUPABASE_KEY = 'sb_publishable_D9uWGzeDr5b1CWsbvSb8WQ_4UGHbw7-';

(function(){
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
var SPORTS = {pickleball:'Pickleball', badminton:'Badminton'};
var SOURCES = {web:'Website',desk:'Front desk',playtomic:'Playtomic',courtreserve:'CourtReserve',program:'Lessons & leagues',hold:'Maintenance hold'};
var CODES = {web:'WEB',desk:'DSK',playtomic:'PLY',courtreserve:'CRS',program:'PRG',hold:'HLD'};
var ERR = {
  slot_taken:'That time was just taken. Pick another slot.', slot_blocked:'That time is blocked for maintenance.', slot_has_bookings:'There are bookings in that period. Cancel them first.',
  not_signed_in:'Sign in to continue.', name_required:'Enter your name.', in_the_past:'That time has already passed.', too_far_ahead:'That date is too far ahead to book yet.',
  too_many_bookings:'You have reached the limit of upcoming bookings. Cancel one or wait until one has passed.', outside_opening_hours:'That is outside opening hours.',
  invalid_length:'Choose 1 or 2 hours.', invalid_sport:'Choose pickleball or badminton.', not_on_the_hour:'Bookings start on the hour.', court_not_found:'That court is not available.',
  not_allowed:'Staff only.', too_late_to_cancel:'Too late to cancel online. Please call the club.', booking_not_found:'Booking not found.'
};
var $ = function(id){return document.getElementById(id)};
var esc = function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad = function(n){return String(n).padStart(2,'0')};
function errText(e){var m=(e&&e.message)||'';for(var k in ERR)if(m.indexOf(k)>-1)return ERR[k];return 'Something went wrong. Please try again.'}

var S = {view:'book',user:null,isAdmin:false,settings:null,courts:[],rates:{},date:null,days:[],sport:'pickleball',
  busy:{},staffRows:[],sel:null,dur:1,done:null,err:'',busyBtn:false,mSel:null,confirmCancel:false,mine:[],
  form:{name:'',phone:'',email:'',password:'',password2:'',stype:'desk',reason:'',slen:1,ssport:'pickleball'},
  authMode:'signin',showAuth:false,authMsg:'',authOk:false,authBusy:false,ready:false,loadErr:''};

/* ---------- time zone helpers: everything shown is in the club's time zone ---------- */
function tzParts(d,tz){var f=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}),p={};f.formatToParts(d).forEach(function(x){p[x.type]=x.value});return p}
function zoned(dateStr,hour,tz){var a=dateStr.split('-').map(Number),target=Date.UTC(a[0],a[1]-1,a[2],hour),g=target;
  for(var i=0;i<3;i++){var p=tzParts(new Date(g),tz);g+=target-Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second)}return new Date(g)}
function todayIn(tz){var p=tzParts(new Date(),tz);return p.year+'-'+p.month+'-'+p.day}
function addDays(s,n){var a=s.split('-').map(Number),d=new Date(Date.UTC(a[0],a[1]-1,a[2]+n));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function dlabel(s){var a=s.split('-').map(Number);return new Date(Date.UTC(a[0],a[1]-1,a[2],12)).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'})}
function dow(s){var a=s.split('-').map(Number);return new Date(Date.UTC(a[0],a[1]-1,a[2],12)).getUTCDay()}
function hourOf(ts){return +tzParts(new Date(ts),S.settings.timezone).hour}
var hl=function(h){return (h%12||12)+(h<12?'a':'p')};
var fmt=function(h){return (h%12||12)+':00 '+(h<12?'am':'pm')};
function fmtTs(ts){var p=tzParts(new Date(ts),S.settings.timezone);return dlabel(p.year+'-'+p.month+'-'+p.day)+', '+fmt(+p.hour)}
function hoursFor(c){var o=parseInt(c.open_time,10),cl=parseInt(c.close_time,10),a=[];for(var h=o;h<cl;h++)a.push(h);return a}
function allHours(){var min=24,max=0;S.courts.forEach(function(c){min=Math.min(min,parseInt(c.open_time,10));max=Math.max(max,parseInt(c.close_time,10))});var a=[];for(var h=min;h<max;h++)a.push(h);return a}
function priceFor(sport,date,h){var peak=dow(date)%6===0||h>=S.settings.peak_start_hour;var r=S.rates[sport+(peak?'_p':'_o')];return {amt:r,peak:peak}}
function slotRange(date,h){return [zoned(date,h,S.settings.timezone),zoned(date,h+1,S.settings.timezone)]}
function isBusy(courtId,date,h){var r=slotRange(date,h),list=S.busy[courtId]||[];return list.some(function(b){return new Date(b.start_time)<r[1]&&new Date(b.end_time)>r[0]})}
function isPast(date,h){return slotRange(date,h)[0]<=new Date()}
function isFree(courtId,h){return !isBusy(courtId,S.date,h)&&!isPast(S.date,h)}

/* ---------- loading ---------- */
async function loadStatic(){
  var r=await Promise.all([sb.from('club_settings').select('*').single(),sb.from('courts').select('*').eq('is_active',true).order('name'),sb.from('court_rates').select('*')]);
  if(r[0].error||r[1].error||r[2].error)throw (r[0].error||r[1].error||r[2].error);
  S.settings=r[0].data;S.courts=r[1].data;S.rates={};r[2].data.forEach(function(x){S.rates[x.sport+(x.peak?'_p':'_o')]=Number(x.price)});
  var t=todayIn(S.settings.timezone);S.date=t;S.days=[];for(var i=0;i<=S.settings.max_days_ahead;i++)S.days.push(addDays(t,i));
}
async function loadAvailability(){
  var a=zoned(S.date,0,S.settings.timezone).toISOString(),b=zoned(addDays(S.date,1),0,S.settings.timezone).toISOString();
  var res=await Promise.all(S.courts.map(function(c){return sb.rpc('get_court_busy_slots',{p_court_id:c.id,p_range_start:a,p_range_end:b})}));
  S.busy={};res.forEach(function(r,i){S.busy[S.courts[i].id]=r.data||[]});
  if(S.view==='staff'&&S.isAdmin){
    var q=await sb.from('bookings').select('*').neq('status','cancelled').lt('start_time',b).gt('end_time',a).order('start_time');
    S.staffRows=q.data||[];
    var bl=await sb.from('blocked_slots').select('*').lt('start_time',b).gt('end_time',a);
    (bl.data||[]).forEach(function(x){S.staffRows.push({id:'blk-'+x.id,court_id:x.court_id,start_time:x.start_time,end_time:x.end_time,source:'hold',label:x.reason||'Maintenance',blockId:x.id,sport:'',status:'confirmed',reference:'—'})});
  }
}
async function loadProfile(){
  var s=await sb.auth.getSession();S.user=s.data.session?s.data.session.user:null;S.isAdmin=false;
  if(S.user){var p=await sb.from('profiles').select('full_name,phone,is_admin').eq('id',S.user.id).maybeSingle();
    if(p.data){S.isAdmin=!!p.data.is_admin;if(!S.form.name)S.form.name=p.data.full_name||'';if(!S.form.phone)S.form.phone=p.data.phone||''}}
}
async function loadMine(){
  if(!S.user){S.mine=[];return}
  var q=await sb.from('bookings').select('*').eq('user_id',S.user.id).order('start_time',{ascending:false}).limit(50);S.mine=q.data||[];
}

/* ---------- rendering ---------- */
function courtName(id){var c=S.courts.find(function(x){return x.id===id});return c?c.name:''}
function renderHead(){
  var items=[['book','Book a court']];if(S.user)items.push(['mine','My bookings']);if(S.isAdmin)items.push(['staff','Master schedule']);
  $('nav').innerHTML=items.map(function(i){return '<a href="#'+i[0]+'"'+(S.view===i[0]?' aria-current="page"':'')+'>'+i[1]+'</a>'}).join('');
  $('who').innerHTML=S.user?esc(S.user.email)+' · <button class="linkbtn" data-act="signout">Sign out</button>':'<button class="linkbtn" data-act="show-auth">Sign in</button>';
  if(S.settings)$('tagline').textContent='COURT BOOKING · '+S.courts.length+' COURTS · BADMINTON & PICKLEBALL';
  $('notice').innerHTML=S.loadErr?'<div class="notice" role="alert">'+esc(S.loadErr)+'</div>':(!S.ready?'<div class="notice">Loading the club schedule…</div>':'');
}
function renderToolbar(){
  if(!S.ready){$('toolbar').innerHTML='';return}
  $('toolbar').innerHTML='<div class="dates" role="group" aria-label="Date">'+S.days.map(function(s,i){return '<button class="dbtn" data-act="date" data-d="'+s+'" aria-pressed="'+(S.date===s)+'" aria-label="'+esc(dlabel(s))+'"><span>'+(i===0?'Today':dlabel(s).split(',')[0])+'</span><b>'+(+s.slice(8))+'</b></button>'}).join('')+'</div>'+
   (S.view==='book'?'<div class="chips" role="group" aria-label="Sport"><span class="muted" style="margin-right:8px">I want to play</span>'+['pickleball','badminton'].map(function(x){return '<button class="chip" data-act="sport" data-v="'+x+'" aria-pressed="'+(S.sport===x)+'">'+SPORTS[x]+'</button>'}).join('')+'</div>':'');
}
function inSel(c,h){return S.sel&&S.sel.c===c&&h>=S.sel.h&&h<S.sel.h+S.dur}
function staffRec(courtId,h){var r=slotRange(S.date,h);return S.staffRows.find(function(x){return x.court_id===courtId&&new Date(x.start_time)<r[1]&&new Date(x.end_time)>r[0]})}
function renderGrid(){
  if(!S.ready){$('grid').innerHTML='';$('legend').innerHTML='';return}
  var staff=S.view==='staff',H=allHours(),h='<div class="grid" style="--cols:'+H.length+'" role="grid"><div></div>'+H.map(function(x){return '<div class="g-head">'+hl(x)+'</div>'}).join('');
  S.courts.forEach(function(c){
    var open=hoursFor(c);
    h+='<div class="g-court" role="rowheader"><b>'+esc(c.name)+'</b><span>'+esc(c.description||'')+'</span></div>';
    H.forEach(function(hr){
      var lab=c.name+', '+fmt(hr);
      if(open.indexOf(hr)<0){h+='<div class="cell past" aria-label="Closed"></div>';return}
      var rec=staff?staffRec(c.id,hr):null,busy=isBusy(c.id,S.date,hr);
      if(busy){
        if(staff&&rec){
          var prev=staffRec(c.id,hr-1),cont=prev&&prev.id===rec.id,pk=S.mSel&&S.mSel.c===c.id&&S.mSel.h===hr;
          h+='<button class="cell booked s-'+rec.source+(cont?' cont':'')+(pk?' picked':'')+'" data-act="open" data-c="'+c.id+'" data-h="'+hr+'" aria-label="'+esc(lab+', '+SOURCES[rec.source]+', '+(rec.player_name||rec.label||''))+'">'+(cont?'':'<b>'+CODES[rec.source]+(rec.sport?' · '+(rec.sport==='pickleball'?'PB':'BD'):'')+'</b><i>'+esc(rec.player_name||rec.label||'')+'</i>')+'</button>';
        }else h+='<div class="cell booked" aria-label="'+esc(lab+', taken')+'"><i>Taken</i></div>';
      }else if(isPast(S.date,hr))h+='<div class="cell past" aria-label="'+esc(lab+', passed')+'"></div>';
      else{
        var sel=staff?(S.mSel&&S.mSel.c===c.id&&S.mSel.h===hr):inSel(c.id,hr);
        h+='<button class="cell free'+(sel?' sel':'')+'" data-act="'+(staff?'open':'pick')+'" data-c="'+c.id+'" data-h="'+hr+'" aria-label="'+esc(lab+', open')+'">'+(staff?'+':'$'+priceFor(S.sport,S.date,hr).amt)+'</button>';
      }
    });
  });
  $('grid').innerHTML=h+'</div>';
  var lg='<span><i class="sw free"></i>Open'+(staff?'':' (price per hour)')+'</span><span><i class="sw past"></i>Passed or closed</span>';
  if(staff)lg+=Object.keys(SOURCES).map(function(s){return '<span><i class="sw s-'+s+'"></i>'+CODES[s]+' '+SOURCES[s]+'</span>'}).join('')+'<span>PB = pickleball, BD = badminton</span>';
  else lg+='<span><i class="sw sel"></i>Your pick</span><span><i class="sw s-hold"></i>Taken</span>';
  $('legend').innerHTML=lg;
}
function renderStats(){
  if(S.view!=='staff'||!S.ready){$('stats').innerHTML='';return}
  var tot=0,booked=0;S.courts.forEach(function(c){hoursFor(c).forEach(function(h){tot++;if(isBusy(c.id,S.date,h))booked++})});
  $('stats').innerHTML='<div class="stats"><div><b>'+Math.round(booked/Math.max(tot,1)*100)+'%</b> <span class="muted">of court-hours taken on '+esc(dlabel(S.date))+'</span></div><span class="muted">'+booked+' of '+tot+' court-hours</span></div>';
}
function authBox(){
  var m=S.authMode,f=S.form,dis=S.authBusy?' disabled':'';
  var msg=S.authMsg?'<div class="'+(S.authOk?'okmsg':'err')+'" role="alert">'+esc(S.authMsg)+'</div>':'';
  var email='<label>Email<input id="f-auth-email" data-f="email" type="email" autocomplete="email" value="'+esc(f.email)+'"></label>';
  var pw=function(id,lab,key,ac){return '<label>'+lab+'<input id="'+id+'" data-f="'+key+'" type="password" autocomplete="'+ac+'" value="'+esc(f[key])+'"></label>'};
  var link=function(mode,text){return '<button type="button" class="linkbtn" data-act="auth-mode" data-m="'+mode+'">'+text+'</button>'};
  var btn=function(t){return '<button class="btn" type="submit"'+dis+'>'+(S.authBusy?'Please wait…':t)+'</button>'};
  var head={signin:'Sign in',signup:'Create account',forgot:'Reset your password',reset:'Choose a new password',magic:'Sign in by email link'}[m];
  var body='';
  if(m==='signin')body=email+pw('f-auth-pw','Password','password','current-password')+msg+btn('Sign in')+'<div class="row" style="justify-content:space-between">'+link('forgot','Forgot password?')+link('signup','Create an account')+'</div><div>'+link('magic','Email me a sign-in link instead')+'</div>';
  else if(m==='signup')body='<label>Your name<input id="f-auth-name" data-f="name" autocomplete="name" value="'+esc(f.name)+'"></label>'+email+pw('f-auth-pw','Password (8+ characters)','password','new-password')+msg+btn('Create account')+'<div>'+link('signin','I already have an account')+'</div>';
  else if(m==='forgot')body='<p class="muted">Enter your email and we will send a link to choose a new password.</p>'+email+msg+btn('Send reset link')+'<div>'+link('signin','Back to sign in')+'</div>';
  else if(m==='reset')body='<p class="muted">Choose a new password for your account.</p>'+pw('f-auth-pw','New password (8+ characters)','password','new-password')+pw('f-auth-pw2','Repeat new password','password2','new-password')+msg+btn('Save new password');
  else body='<p class="muted">We email you a link that signs you in. No password needed.</p>'+email+msg+btn('Email me a link')+'<div>'+link('signin','Use my password instead')+'</div>';
  return '<h2>'+head+'</h2><form data-form="auth" novalidate style="display:flex;flex-direction:column;gap:14px">'+body+'</form>';
}
function signInBox(){return authBox()}
function panelBook(){
  if(S.authMode==='reset'||(!S.user&&S.showAuth))return authBox();
  if(S.done){var d=S.done;return '<h2>Court booked</h2><div class="ref" id="refbox">'+esc(d.reference)+'</div><dl><dt>Court</dt><dd>'+esc(d.court)+' · '+SPORTS[d.sport]+'</dd><dt>When</dt><dd>'+esc(fmtTs(d.start_time))+' – '+esc(fmt(hourOf(d.end_time)))+'</dd><dt>Amount</dt><dd>$'+Number(d.price)+', pay at the club</dd></dl><p class="muted">Show this reference at the front desk. You can see and cancel it under My bookings.</p><button class="btn" data-act="again">Book another</button>'}
  if(!S.sel)return '<h2>Reserve a court</h2><p>Pick an open slot on the grid. Each square is one hour on one court.</p><dl><dt>Off-peak</dt><dd>Weekdays before '+fmt(S.settings.peak_start_hour)+'. Pickleball $'+S.rates.pickleball_o+', badminton $'+S.rates.badminton_o+'.</dd><dt>Peak</dt><dd>Weekdays from '+fmt(S.settings.peak_start_hour)+' and all weekend. Pickleball $'+S.rates.pickleball_p+', badminton $'+S.rates.badminton_p+'.</dd><dt>Payment</dt><dd>At the club.</dd></dl>';
  var c=S.courts.find(function(x){return x.id===S.sel.c}),h=S.sel.h,can2=S.settings.max_hours>=2&&hoursFor(c).indexOf(h+1)>-1&&isFree(c.id,h+1);
  var tot=0,peak=false;for(var i=0;i<S.dur;i++){var p=priceFor(S.sport,S.date,h+i);tot+=p.amt;if(p.peak)peak=true}
  return '<h2>'+esc(c.name)+' · '+SPORTS[S.sport]+'</h2><p class="when">'+esc(dlabel(S.date))+' · '+fmt(h)+' – '+fmt(h+S.dur)+'</p>'+
   '<div class="seg" role="group" aria-label="Duration"><button data-act="dur" data-v="1" aria-pressed="'+(S.dur===1)+'">1 hour</button><button data-act="dur" data-v="2" aria-pressed="'+(S.dur===2)+'"'+(can2?'':' disabled')+'>2 hours</button></div>'+
   '<div class="price"><span class="muted">'+(peak?'Peak rate':'Off-peak rate')+'</span><b>$'+tot+'</b></div>'+
   (S.user?'<label>Your name<input id="f-name" data-f="name" autocomplete="name" value="'+esc(S.form.name)+'"></label><label>Phone (optional)<input id="f-phone" data-f="phone" type="tel" autocomplete="tel" value="'+esc(S.form.phone)+'"></label>'+(S.err?'<div class="err" role="alert">'+esc(S.err)+'</div>':'')+'<button class="btn" data-act="book"'+(S.busyBtn?' disabled':'')+'>'+(S.busyBtn?'Booking…':'Confirm booking · $'+tot)+'</button><p class="muted">Pay at the club. The server confirms the final price.</p>':signInBox());
}
function panelStaff(){
  if(!S.mSel)return '<h2>Day control</h2><p>Select any square. Open squares take phone bookings, lessons, leagues and maintenance blocks. Booked squares show who has them and let you cancel.</p><p class="muted">The database refuses any second booking for the same court and time, whichever source it comes from.</p>';
  var c=S.courts.find(function(x){return x.id===S.mSel.c}),h=S.mSel.h,rec=staffRec(c.id,h);
  if(rec){return '<h2>'+esc(c.name)+'</h2><p class="when">'+esc(fmtTs(rec.start_time))+' – '+esc(fmt(hourOf(rec.end_time)))+'</p><dl><dt>Held by</dt><dd>'+esc(rec.player_name||rec.label||'—')+'</dd><dt>Phone</dt><dd>'+esc(rec.player_phone||'—')+'</dd><dt>Source</dt><dd>'+esc(SOURCES[rec.source])+'</dd><dt>Sport</dt><dd>'+esc(SPORTS[rec.sport]||'—')+'</dd><dt>Reference</dt><dd style="font-family:var(--font-mono)">'+esc(rec.reference)+'</dd></dl>'+(S.err?'<div class="err" role="alert">'+esc(S.err)+'</div>':'')+
    (S.confirmCancel?'<p class="err">'+(rec.blockId?'Remove this block?':'Cancel this booking and free the court?')+'</p><div class="row"><button class="btn danger" data-act="cancel-yes" data-id="'+esc(rec.id)+'"'+(S.busyBtn?' disabled':'')+'>Yes</button><button class="btn ghost" data-act="cancel-no">Keep it</button></div>':'<button class="btn ghost" data-act="cancel">'+(rec.blockId?'Remove block':'Cancel booking')+'</button>');}
  var t=S.form.stype,maxLen=Math.min(4,parseInt(c.close_time,10)-h),o='';for(var i=1;i<=maxLen;i++)o+='<option value="'+i+'"'+(+S.form.slen===i?' selected':'')+'>'+i+' hour'+(i>1?'s':'')+'</option>';
  return '<h2>'+esc(c.name)+'</h2><p class="when">'+esc(dlabel(S.date))+' · from '+fmt(h)+'</p><label>Type<select id="f-stype" data-f="stype"><option value="desk"'+(t==='desk'?' selected':'')+'>Phone or walk-up booking</option><option value="program"'+(t==='program'?' selected':'')+'>Lesson or league</option><option value="hold"'+(t==='hold'?' selected':'')+'>Maintenance block</option></select></label>'+
   (t==='desk'?'<label>Player name<input id="f-sname" data-f="name" value="'+esc(S.form.name)+'"></label><label>Phone (optional)<input id="f-sphone" data-f="phone" value="'+esc(S.form.phone)+'"></label>':'<label>'+(t==='hold'?'Reason':'Programme name')+'<input id="f-reason" data-f="reason" value="'+esc(S.form.reason)+'"></label>')+
   (t!=='hold'?'<label>Sport<select id="f-ssport" data-f="ssport"><option value="pickleball"'+(S.form.ssport==='pickleball'?' selected':'')+'>Pickleball</option><option value="badminton"'+(S.form.ssport==='badminton'?' selected':'')+'>Badminton</option></select></label>':'')+
   '<label>Length<select id="f-slen" data-f="slen">'+o+'</select></label>'+(S.err?'<div class="err" role="alert">'+esc(S.err)+'</div>':'')+'<button class="btn" data-act="staff-add"'+(S.busyBtn?' disabled':'')+'>Add to schedule</button>';
}
function renderPanel(){if(!S.ready){$('panel').innerHTML='';return}$('panel').innerHTML=S.view==='staff'?panelStaff():panelBook()}
function renderMine(){
  var now=new Date();
  $('v-mine').innerHTML='<h2 style="margin-top:20px">My bookings</h2>'+(S.mine.length?'<div class="list">'+S.mine.map(function(b){
    var up=new Date(b.end_time)>now&&b.status!=='cancelled';
    return '<div class="item"><div><h3>'+esc(courtName(b.court_id))+' · '+SPORTS[b.sport]+'</h3><div>'+esc(fmtTs(b.start_time))+' – '+esc(fmt(hourOf(b.end_time)))+' · $'+Number(b.price)+'</div><div class="muted" style="font-family:var(--font-mono)">'+esc(b.reference)+'</div></div><div class="row" style="flex:none;align-items:center">'+(b.status==='cancelled'?'<span class="tag cx">Cancelled</span>':up?'<button class="btn ghost" data-act="mine-cancel" data-id="'+b.id+'">Cancel</button>':'<span class="tag cx">Past</span>')+'</div></div>'}).join('')+'</div>':'<p class="muted" style="margin-top:12px">No bookings yet.</p>')+(S.err?'<div class="err" role="alert" style="margin-top:10px">'+esc(S.err)+'</div>':'');
}
function renderAll(){
  renderHead();
  var g=S.view!=='mine';$('v-grid').hidden=!g;$('v-mine').hidden=g;
  if(g){renderToolbar();renderStats();renderGrid();renderPanel()}else renderMine();
}

/* ---------- actions ---------- */
async function refresh(){try{await loadAvailability();S.loadErr=''}catch(e){S.loadErr='Could not load availability. Check your connection.'}
  if(S.view==='mine')renderMine();else{renderGrid();renderStats();renderHead()}}
async function doBook(){
  var f=S.form;S.err='';if(!f.name.trim()){S.err='Enter your name.';return renderPanel()}
  var c=S.courts.find(function(x){return x.id===S.sel.c});S.busyBtn=true;renderPanel();
  var r=await sb.rpc('create_booking',{p_court_id:c.id,p_sport:S.sport,p_start:zoned(S.date,S.sel.h,S.settings.timezone).toISOString(),p_hours:S.dur,p_player_name:f.name.trim(),p_player_phone:f.phone.trim()||null});
  S.busyBtn=false;
  if(r.error){S.err=errText(r.error);await refresh();if(S.sel&&!isFree(S.sel.c,S.sel.h)){S.sel=null;S.dur=1}return renderPanel()}
  S.done={reference:r.data.reference,court:c.name,sport:S.sport,start_time:r.data.start_time,end_time:r.data.end_time,price:r.data.price};S.sel=null;S.dur=1;
  await refresh();renderPanel();
}
async function doStaffAdd(){
  var f=S.form,t=f.stype,c=S.courts.find(function(x){return x.id===S.mSel.c}),h=S.mSel.h,len=+f.slen||1;S.err='';
  if(t==='desk'&&!f.name.trim())S.err='Enter the player name.';else if(t!=='desk'&&!f.reason.trim())S.err=t==='hold'?'Enter a reason for the block.':'Enter a programme name.';
  if(S.err)return renderPanel();
  S.busyBtn=true;renderPanel();var start=zoned(S.date,h,S.settings.timezone),res;
  if(t==='hold')res=await sb.from('blocked_slots').insert({court_id:c.id,start_time:start.toISOString(),end_time:zoned(S.date,h+len,S.settings.timezone).toISOString(),reason:f.reason.trim()});
  else res=await sb.rpc('admin_create_booking',{p_court_id:c.id,p_sport:f.ssport,p_start:start.toISOString(),p_hours:len,p_source:t,p_label:t==='program'?f.reason.trim():null,p_player_name:t==='desk'?f.name.trim():null,p_player_phone:t==='desk'?(f.phone.trim()||null):null});
  S.busyBtn=false;
  if(res.error){S.err=(res.error.message||'').indexOf('slot_')>-1||/overlap|exclusion|conflict/i.test(res.error.message||'')?'One of those hours is already held.':errText(res.error)}
  else{S.form.name='';S.form.phone='';S.form.reason='';S.form.slen=1}
  await refresh();renderPanel();
}
async function doStaffCancel(id){
  S.busyBtn=true;renderPanel();var rec=S.staffRows.find(function(x){return String(x.id)===id}),res;
  if(rec&&rec.blockId)res=await sb.from('blocked_slots').delete().eq('id',rec.blockId);else res=await sb.rpc('cancel_booking',{p_booking_id:id});
  S.busyBtn=false;S.confirmCancel=false;if(res.error)S.err=errText(res.error);else{S.mSel=null;S.err=''}
  await refresh();renderPanel();
}
async function doMineCancel(id){
  S.err='';var r=await sb.rpc('cancel_booking',{p_booking_id:id});if(r.error)S.err=errText(r.error);
  await loadMine();renderMine();
}
function authErr(e){
  var s=((e&&e.code)||'')+' '+((e&&e.message)||'');s=s.toLowerCase();
  if(s.indexOf('invalid login')>-1||s.indexOf('invalid_credentials')>-1)return 'Email or password is incorrect.';
  if(s.indexOf('not confirmed')>-1||s.indexOf('email_not_confirmed')>-1)return 'Confirm your email first, using the link we sent you.';
  if(s.indexOf('already')>-1)return 'That email already has an account. Sign in instead.';
  if(s.indexOf('rate')>-1||s.indexOf('too many')>-1)return 'Too many attempts. Wait a few minutes and try again.';
  if(s.indexOf('same')>-1&&s.indexOf('password')>-1)return 'Choose a password different from your old one.';
  if(s.indexOf('weak')>-1||s.indexOf('password')>-1)return 'Choose a stronger password (8+ characters).';
  return 'Could not complete that. Please try again.';
}
async function doAuth(){
  var m=S.authMode,f=S.form,em=(f.email||'').trim(),back=location.origin+location.pathname;S.authMsg='';S.authOk=false;
  if(m!=='reset'&&!/^\S+@\S+\.\S+$/.test(em))S.authMsg='Enter a valid email address.';
  else if(m==='signin'&&!f.password)S.authMsg='Enter your password.';
  else if(m==='signup'&&!f.name.trim())S.authMsg='Enter your name.';
  else if((m==='signup'||m==='reset')&&(f.password||'').length<8)S.authMsg='Use at least 8 characters for your password.';
  else if(m==='reset'&&f.password!==f.password2)S.authMsg='The two passwords do not match.';
  if(S.authMsg)return renderPanel();
  S.authBusy=true;renderPanel();var r;
  try{
    if(m==='signin')r=await sb.auth.signInWithPassword({email:em,password:f.password});
    else if(m==='signup')r=await sb.auth.signUp({email:em,password:f.password,options:{data:{full_name:f.name.trim()},emailRedirectTo:back}});
    else if(m==='forgot')r=await sb.auth.resetPasswordForEmail(em,{redirectTo:back});
    else if(m==='reset')r=await sb.auth.updateUser({password:f.password});
    else r=await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:back}});
  }catch(e){r={error:e}}
  S.authBusy=false;
  if(r.error){S.authMsg=authErr(r.error)}
  else if(m==='signin'){f.password='';S.showAuth=false}
  else if(m==='signup'){
    if(r.data&&r.data.session){f.password='';S.showAuth=false}
    else if(r.data&&r.data.user&&r.data.user.identities&&r.data.user.identities.length===0)S.authMsg='That email already has an account. Sign in instead.';
    else{S.authOk=true;S.authMsg='Account created. Check your email to confirm it, then sign in. The email can take a few minutes; check spam.';f.password=''}
  }
  else if(m==='forgot'){S.authOk=true;S.authMsg='If that email has an account, a reset link is on its way. Check your inbox and spam.'}
  else if(m==='reset'){f.password='';f.password2='';S.authMode='signin';S.showAuth=false;await loadProfile();renderHead()}
  else{S.authOk=true;S.authMsg='Check your email for the sign-in link, then return to this page.'}
  renderPanel();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;var a=t.dataset.act;
  if(a==='date'){S.date=t.dataset.d;S.sel=null;S.dur=1;S.mSel=null;S.done=null;S.err='';S.confirmCancel=false;renderToolbar();refresh().then(renderPanel)}
  else if(a==='sport'){S.sport=t.dataset.v;renderToolbar();renderGrid();renderPanel()}
  else if(a==='pick'){var c=t.dataset.c,h=+t.dataset.h,court=S.courts.find(function(x){return x.id===c});S.done=null;S.err='';S.showAuth=false;S.sel={c:c,h:h};
    if(S.dur===2&&!(hoursFor(court).indexOf(h+1)>-1&&isFree(c,h+1)))S.dur=1;renderGrid();renderPanel()}
  else if(a==='dur'){S.dur=+t.dataset.v;renderGrid();renderPanel()}
  else if(a==='book')doBook();
  else if(a==='again'){S.done=null;renderPanel()}
  else if(a==='show-auth'){S.showAuth=true;S.authMode='signin';S.authMsg='';S.sel=null;renderGrid();renderPanel()}
  else if(a==='auth-mode'){S.authMode=t.dataset.m;S.authMsg='';S.authOk=false;renderPanel()}
  else if(a==='signout'){sb.auth.signOut().then(function(){S.user=null;S.isAdmin=false;S.mine=[];location.hash='#book';init(true)})}
  else if(a==='open'){S.mSel={c:t.dataset.c,h:+t.dataset.h};S.err='';S.confirmCancel=false;renderGrid();renderPanel()}
  else if(a==='staff-add')doStaffAdd();
  else if(a==='cancel'){S.confirmCancel=true;renderPanel()}
  else if(a==='cancel-no'){S.confirmCancel=false;renderPanel()}
  else if(a==='cancel-yes')doStaffCancel(t.dataset.id);
  else if(a==='mine-cancel')doMineCancel(t.dataset.id);
});
document.addEventListener('submit',function(e){var fm=e.target;if(fm.dataset&&fm.dataset.form==='auth'){e.preventDefault();doAuth()}});
document.addEventListener('input',function(e){var f=e.target.dataset&&e.target.dataset.f;if(f)S.form[f]=e.target.value});
document.addEventListener('change',function(e){var f=e.target.dataset&&e.target.dataset.f;if(f==='stype'){S.form.stype=e.target.value;S.err='';renderPanel()}});
async function route(){
  var v=(location.hash||'#book').slice(1);if(['book','mine','staff'].indexOf(v)<0)v='book';
  if(v==='mine'&&!S.user)v='book';if(v==='staff'&&!S.isAdmin)v='book';
  S.view=v;S.sel=null;S.mSel=null;S.err='';S.confirmCancel=false;S.dur=1;
  if(v==='mine')await loadMine();
  renderAll();if(S.ready&&v!=='mine')await refresh();
}
window.addEventListener('hashchange',route);
async function init(soft){
  try{
    if(!soft||!S.settings)await loadStatic();
    await loadProfile();S.ready=true;S.loadErr='';
  }catch(e){S.loadErr='The booking service is not reachable right now. Please try again shortly.';S.ready=false}
  await route();
}
sb.auth.onAuthStateChange(function(ev,session){
  setTimeout(function(){
    if(ev==='PASSWORD_RECOVERY'){S.authMode='reset';S.showAuth=true;S.authMsg='';S.form.password='';S.form.password2='';renderHead();renderPanel();return}
    if(ev!=='SIGNED_IN'&&ev!=='SIGNED_OUT')return;
    var uid=session&&session.user?session.user.id:null,cur=S.user?S.user.id:null;
    if(ev==='SIGNED_IN'&&uid===cur)return;
    loadProfile().then(function(){S.authMsg='';S.showAuth=false;renderHead();route()});
  },0);
});
setInterval(function(){if(!document.hidden&&S.ready&&S.view!=='mine'&&!S.busyBtn)refresh()},30000);
renderAll();init();
})();
</script>
</body>
